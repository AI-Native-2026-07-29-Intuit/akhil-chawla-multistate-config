# argocd/applicationsets/multistate-api-envs.yaml
# Templates one Application per env. The list generator drives
# (env, overlay, namespace, wave) tuples; the clusters generator
# scopes the fleet to workload-tier clusters.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: multistate-api-envs
  namespace: argocd
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true

  generators:
    - matrix:
        generators:
          - list:
              elements:
                - env: dev
                  overlay: overlays/dev
                  namespace: multistate-dev
                  wave: "0"
                - env: staging
                  overlay: overlays/staging
                  namespace: multistate-staging
                  wave: "1"
                - env: prod
                  overlay: overlays/prod
                  namespace: multistate-prod
                  wave: "2"
          - clusters:
              selector:
                matchLabels:
                  uptimecrew.example.internal/tier: workload

  template:
    metadata:
      name: multistate-api-{{env}}
      namespace: argocd
      # preserveResourcesOnDeletion: true (spec.syncPolicy above) instructs the
      # ApplicationSet controller to OMIT resources-finalizer on generated
      # Applications at runtime so deleted matrix entries leave cluster workloads
      # in place (see multistate-api/GITOPS.md Run 1 vs Run 2). Task 1 finalizer
      # shape is documented there; live apps intentionally have no cascade finalizer.
      annotations:
        argocd.argoproj.io/sync-wave: "{{wave}}"
      labels:
        env: "{{env}}"
        team: multistate
    spec:
      project: multistate
      source:
        repoURL: https://github.com/AI-Native-2026-07-29-Intuit/akhil-chawla-multistate-config.git
        path: "{{overlay}}"
        targetRevision: w6d2-implementation
        kustomize:
          images:
            - uptimecrew/multistate-api:0.1.0
      destination:
        server: "{{server}}"
        namespace: "{{namespace}}"
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /status
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - PrunePropagationPolicy=foreground
          - PruneLast=true
          - ApplyOutOfSyncOnly=true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
