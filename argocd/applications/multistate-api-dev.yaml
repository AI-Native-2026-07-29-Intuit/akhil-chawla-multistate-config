apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: multistate-api-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    env: dev
    team: multistate
spec:
  project: multistate
  source:
    repoURL: https://github.com/AI-Native-2026-07-29-Intuit/akhil-chawla-multistate-config.git
    path: overlays/dev
    targetRevision: main
    kustomize:
      images:
        - uptimecrew/multistate-api:0.1.0
  destination:
    server: https://kubernetes.default.svc
    namespace: multistate-dev
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /status
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
