# argocd-system/notifications-cm.yaml
# Wires argocd-notifications-controller to Slack. The Bot OAuth token
# (xoxb-...) is held in argocd-notifications-secret:
#   kubectl create secret generic argocd-notifications-secret \
#     --from-literal=slack-token="$SLACK_BOT_TOKEN" -n argocd
# Never commit the token to Git.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  service.slack: |
    token: $slack-token

  trigger.on-sync-failed: |
    - description: Application sync failed or manifest generation failed.
      send:    [app-sync-failed]
      when:    (app.status.operationState != nil && app.status.operationState.phase in ['Error', 'Failed']) || (app.status.conditions != nil && len(app.status.conditions) > 0 && app.status.conditions[0].type == 'ComparisonError')

  trigger.on-health-degraded: |
    - description: Application health degraded.
      send:    [app-health-degraded]
      when:    app.status.health.status == 'Degraded'

  template.app-sync-failed: |
    message: |
      {{.app.metadata.name}} sync FAILED.
      Project:   {{.app.spec.project}}
      Sync:      {{.app.status.sync.status}}
    slack:
      attachments: |
        [{
          "title":   "{{.app.metadata.name}} sync failed",
          "color":   "#E96D76",
          "fields":  [
            {"title": "Project",     "value": "{{.app.spec.project}}",           "short": true},
            {"title": "Sync Status", "value": "{{.app.status.sync.status}}",     "short": true}
          ]
        }]

  template.app-health-degraded: |
    message: |
      {{.app.metadata.name}} health is DEGRADED.
      Project:   {{.app.spec.project}}
      Status:    {{.app.status.health.status}}
      Message:   {{.app.status.health.message}}
    slack:
      attachments: |
        [{
          "title":   "{{.app.metadata.name}} health degraded",
          "color":   "#F2C744",
          "fields":  [
            {"title": "Status",   "value": "{{.app.status.health.status}}",  "short": true},
            {"title": "Message",  "value": "{{.app.status.health.message}}", "short": false}
          ]
        }]

  subscriptions: |
    - recipients: [slack:multi-state-deploys-akhil-chawla]
      triggers:   [on-sync-failed, on-health-degraded]
      selector:   team=multistate
