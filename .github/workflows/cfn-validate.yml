# .github/workflows/cfn-validate.yml
# TASK 4 CI gate: every PR that touches cfn/ or k8s/aws-authored/cfn/
# runs cfn-lint (serverless profile), cfn-nag (--fail-on-warnings), and
# aws cloudformation validate-template against all stack templates.
name: cfn-validate

on:
  pull_request:
    paths:
      - "cfn/**"
      - "k8s/aws-authored/**"
      - ".github/workflows/cfn-validate.yml"

permissions:
  contents: read

jobs:
  validate:
    name: cfn-lint + cfn-nag + aws validate-template
    # Blacksmith-hosted runner — org GitHub-hosted runners hit billing limits.
    runs-on: blacksmith-2vcpu-ubuntu-2204
    timeout-minutes: 10

    # validate-template calls the CFN API; LocalStack substitutes for real AWS.
    services:
      localstack:
        image: localstack/localstack:4
        env:
          SERVICES: cloudformation
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health || exit 1"
          --health-interval 5s
          --health-retries 12
          --health-start-period 15s

    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localhost:4566

    steps:
      - name: Check out config repo
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608  # v4.1.7

      - name: Set up Python (for cfn-lint + serverless profile)
        uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f  # v5.1.1
        with:
          python-version: "3.12"
      - name: Install cfn-lint + serverless profile
        run: pip install 'cfn-lint>=1.44.0' 'cfn-lint-serverless==0.3.5'

      - name: Set up Ruby (for cfn-nag)
        uses: ruby/setup-ruby@a4effe49ee8ee5b8b5091268c473a4628afb5651  # v1.211.0
        with:
          ruby-version: "3.3"
      - run: gem install cfn-nag -v 0.8.10

      - name: cfn-lint (serverless profile)
        run: |
          set -e
          cfn-lint cfn/*.yaml -a cfn_lint_serverless.rules --non-zero-exit-code error -i W3691
          cfn-lint k8s/aws-authored/cfn/*.yaml --non-zero-exit-code error

      - name: cfn-nag
        run: |
          set -e
          for template in cfn/multistate-*.yaml k8s/aws-authored/cfn/*.yaml; do
            cfn_nag_scan --input-path "$template" --output-format txt --fail-on-warnings
          done

      - name: aws cloudformation validate-template (all stacks)
        run: |
          set -e
          for template in cfn/multistate-*.yaml k8s/aws-authored/cfn/*.yaml; do
            echo "Validating ${template}"
            aws cloudformation validate-template \
              --template-body "file://${template}" \
              --region us-east-1
          done
