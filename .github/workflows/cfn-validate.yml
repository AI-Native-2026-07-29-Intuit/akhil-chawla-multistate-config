# .github/workflows/cfn-validate.yml
# TASK 4 CI gate: every PR that touches cfn/ runs cfn-lint (serverless
# profile), cfn-nag (--fail-on-warnings), and aws cloudformation
# validate-template against all four stack templates.
name: cfn-validate

on:
  pull_request:
    paths:
      - "cfn/**"
      - ".github/workflows/cfn-validate.yml"

permissions:
  contents: read

jobs:
  validate:
    name: cfn-lint + cfn-nag + aws validate-template
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out config repo
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608  # v4.1.7

      - name: Set up Python (for cfn-lint + serverless profile)
        uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f  # v5.1.1
        with:
          python-version: "3.12"
      - name: Install cfn-lint + serverless profile
        run: pip install 'cfn-lint>=1.44.0' 'cfn-lint-serverless==0.3.5'

      - name: Set up Ruby (for cfn-nag)
        uses: ruby/setup-ruby@a4effe49ee8ee5b8b5091268c473a4628afb5651  # v1.211.0
        with:
          ruby-version: "3.3"
      - run: gem install cfn-nag -v 0.8.10

      - name: cfn-lint (serverless profile)
        run: cfn-lint cfn/*.yaml -a cfn_lint_serverless.rules --non-zero-exit-code error -i W3691

      - name: cfn-nag
        run: |
          set -e
          for template in cfn/multistate-*.yaml; do
            cfn_nag_scan --input-path "$template" --output-format txt --fail-on-warnings
          done

      # validate-template is a syntax check — no AWS credentials required.
      - name: aws cloudformation validate-template (bootstrap)
        run: |
          aws cloudformation validate-template \
            --template-body file://cfn/multistate-bootstrap-dev.yaml \
            --region us-east-1

      - name: aws cloudformation validate-template (network)
        run: |
          aws cloudformation validate-template \
            --template-body file://cfn/multistate-network-dev.yaml \
            --region us-east-1

      - name: aws cloudformation validate-template (app)
        run: |
          aws cloudformation validate-template \
            --template-body file://cfn/multistate-app-dev.yaml \
            --region us-east-1

      - name: aws cloudformation validate-template (artifacts)
        run: |
          aws cloudformation validate-template \
            --template-body file://cfn/multistate-artifacts-dev.yaml \
            --region us-east-1
