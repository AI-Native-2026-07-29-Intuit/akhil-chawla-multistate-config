# uptimecrew/multistate-config/overlays/prod/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - namespace.yaml

namespace: multistate-prod

components:
  - ../components/workload-sync-wave

images:
  - name: uptimecrew/multistate-api
    newName: uptimecrew/multistate-api
    newTag: "0.1.0"

replicas:
  - name: multistate-api
    count: 3

patches:
  - target:
      kind: ConfigMap
      name: multistate-api-config
    patch: |-
      - op: replace
        path: /data/SPRING_PROFILES_ACTIVE
        value: docker,prod
      - op: add
        path: /data/LOG_LEVEL
        value: WARN
  - target:
      kind: HorizontalPodAutoscaler
      name: multistate-api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
  - target:
      kind: Ingress
      name: multistate-api
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: multistate.prod.uptimecrew.internal
