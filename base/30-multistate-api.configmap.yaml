apiVersion: v1
kind: ConfigMap
metadata:
  name: multistate-api-config
  namespace: multistate-dev
  labels:
    app.kubernetes.io/name: multistate-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: multistate
    app.kubernetes.io/managed-by: kubectl
data:
  SPRING_PROFILES_ACTIVE: docker
  LOGGING_LEVEL_ROOT: INFO
  # postgres-dev / redis-dev, not postgres / redis: a Service named "postgres"
  # or "redis" makes Kubernetes auto-inject POSTGRES_PORT / REDIS_PORT env
  # vars that collide with application.yml's ${POSTGRES_PORT:...} /
  # ${REDIS_PORT:...} placeholders and crash the app on startup — see
  # manifests/observability/dev-redis.yaml's javadoc.
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-dev.multistate-dev.svc.cluster.local:5432/multistate_dev
  SPRING_DATASOURCE_USERNAME: multistate_dev
  SPRING_DATA_REDIS_HOST: redis-dev.multistate-dev.svc.cluster.local
  # SPRING_DATASOURCE_URL above already carries the port for JDBC, but
  # Spring Data Redis binds host/port as SEPARATE properties, and the base
  # (non-profile-specific) block of application.yml sets
  # spring.data.redis.port: ${REDIS_PORT:6380} -- a local-dev-only default
  # chosen to dodge a port collision that does not exist inside a pod. That
  # base block applies to every profile, docker included, so without this
  # override the app tries 6380 against a Service that (correctly) listens
  # on Redis's real default, 6379, and every cache lookup times out instead
  # of failing fast.
  SPRING_DATA_REDIS_PORT: "6379"
  # Same reasoning as SPRING_DATA_REDIS_PORT above: application.yml's docker
  # profile builds the Mongo URI from MONGO_HOST/MONGO_PORT, defaulting to
  # localhost:27017 -- unreachable from this pod -- unless overridden.
  MONGO_HOST: mongo-dev.multistate-dev.svc.cluster.local
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka.multistate-dev.svc.cluster.local:9092
  # Task 3 has not deployed Kafka yet; prevent unresolved DNS from aborting boot.
  SPRING_KAFKA_LISTENER_AUTO_STARTUP: "false"
  # Points at the otel-collector Helm release installed into the monitoring
  # namespace (W5 D5 Task 3); OTLP/gRPC, matching OTEL_EXPORTER_OTLP_PROTOCOL
  # below.
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector-opentelemetry-collector.monitoring.svc.cluster.local:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_SDK_DISABLED: "false"
  OTEL_SERVICE_NAME: multistate-api
  # Head-based sampling at 10%, parent-aware so an upstream-sampled trace
  # stays whole across this service's spans (dev default; see W5 D5 Task 3).
  OTEL_TRACES_SAMPLER: parentbased_traceidratio
  OTEL_TRACES_SAMPLER_ARG: "0.1"
  # Micrometer owns metrics (/actuator/prometheus); Logback owns logs. Avoid
  # double emission through the OTel exporter as well.
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none
  # Library-instrumentation mode (opentelemetry-spring-boot-starter, no
  # javaagent) does not turn on every instrumentation module by default the
  # way the javaagent does — the logback MDC bridge that puts trace_id/span_id
  # into MDC for logback-spring.xml's JSON encoder needs this flag explicitly.
  OTEL_INSTRUMENTATION_LOGBACK_MDC_ENABLED: "true"
  # Same library-instrumentation-mode gap as logback-mdc above: the
  # @WithSpan AOP aspect (InstrumentationAnnotationsAutoConfiguration,
  # module="annotations") is also gated behind an explicit flag, not on by
  # default the way the javaagent's annotation processing is.
  OTEL_INSTRUMENTATION_ANNOTATIONS_ENABLED: "true"
