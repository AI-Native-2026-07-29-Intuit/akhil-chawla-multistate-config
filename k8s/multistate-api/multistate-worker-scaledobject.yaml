# k8s/multistate-api/multistate-worker-scaledobject.yaml
# TASK 1 (RUNNABLE on k3d): KEDA scales the tenants.events
# worker on Kafka consumer-group lag. lagThreshold: "10" means the
# generated HPA targets 10 messages of lag per pod; 73 messages of
# lag scale to ceil(73/10) = 8 pods -- the same ceil math the
# Task 4 SQS queueLength variant uses. The dev Kafka broker is plaintext,
# so no TriggerAuthentication is needed here; the credential
# discipline lives in the SQS variant (Task 4, author-only).
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: multistate-worker-scaledobject
  namespace: multistate-dev
  labels:
    app.kubernetes.io/name: multistate-api-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: multistate
spec:
  scaleTargetRef:
    name: multistate-api-worker
  minReplicaCount: 0
  maxReplicaCount: 28
  pollingInterval: 15
  cooldownPeriod: 300
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka.multistate-dev.svc.cluster.local:9092
        consumerGroup: multistate-read-model-builder
        topic: tenants.events
        lagThreshold: "10"
        # Do not set offsetResetPolicy: latest — it caused KEDA to report
        # lagThreshold (10/10) while consumer-group lag was 4000+, capping
        # scale-up at 1 pod. Default lag calculation uses the full backlog.
