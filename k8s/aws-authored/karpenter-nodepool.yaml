# k8s/aws-authored/karpenter-nodepool.yaml
# TASK 4 (AUTHOR-AND-DEFEND -- Karpenter is AWS-native; it cannot
# run on k3d). Spot + On-Demand mix across three AZs; consolidation
# repacks underutilised nodes; limits cap a runaway HPA's blast
# radius; the Task 2 PDB protects the floor during consolidation.
#
# Why limits: if multistate-api-hpa (Task 2) misbehaves and keeps
# requesting pods, Karpenter would otherwise provision unbounded EC2.
# The cpu/memory caps here are the fleet-level circuit breaker — the
# HPA's maxReplicas (28) bounds one Deployment; these limits bound
# the whole node fleet the capstone can grow into.
#
# Why PDB during consolidation: Karpenter's WhenEmptyOrUnderutilized
# policy evicts pods to pack workloads onto fewer nodes. Without
# multistate-api-pdb (minAvailable: 3), consolidation could drain
# the API below the SLO floor while repacking. The PDB forces
# Karpenter/kubelet to leave at least three multistate-api pods
# ready during any voluntary disruption window.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: multistate-mixed
spec:
  template:
    spec:
      requirements:
        - {key: karpenter.sh/capacity-type, operator: In, values: ["spot", "on-demand"]}
        - {key: node.kubernetes.io/instance-type, operator: In, values: ["m5.large","m5.xlarge","m6i.large"]}
        - {key: topology.kubernetes.io/zone, operator: In, values: ["us-east-1a","us-east-1b","us-east-1c"]}
      nodeClassRef: {name: default}
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 600s        # lockstep with the HPA scale-down window
  limits: {cpu: "200", memory: 400Gi}
