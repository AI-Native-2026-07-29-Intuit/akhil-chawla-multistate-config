# k8s/aws-authored/multistate-worker-scaledobject.sqs.yaml
# TASK 4 (AUTHOR-AND-DEFEND -- do NOT apply to k3d): the production
# form of Task 1's trigger. On a managed cluster the worker scales
# on SQS depth, and the SQS GetQueueAttributes permission lives on
# the KEDA OPERATOR's IRSA role via identityOwner: operator -- never
# on the workload pod. This is where the credential-placement
# discipline the plaintext dev Kafka trigger doesn't need is taught.
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: multistate-aws-auth
  namespace: multistate-dev
spec:
  podIdentity:
    provider: aws
    identityOwner: operator      # operator's IRSA role, not the pod's
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: multistate-worker-scaledobject-sqs
  namespace: multistate-dev
spec:
  scaleTargetRef: {name: multistate-api-worker}
  minReplicaCount: 0
  maxReplicaCount: 28
  triggers:
    - type: aws-sqs-queue
      metadata:
        queueURL: https://sqs.us-east-1.amazonaws.com/${AWS_ACCOUNT_ID}/multistate-nexus-jobs-dev
        queueLength: "10"
        awsRegion: us-east-1
        identityOwner: operator
      authenticationRef:
        name: multistate-aws-auth
