# k8s/aws-authored/cfn/multistate-observability-dev.yaml
# TASK 4 (AUTHOR-AND-DEFEND -- X-Ray is AWS-native). ReservoirSize
# floors the rate at 10 traces/sec so a slow window still captures
# the first traces of an incident; FixedRate samples 5% above the
# floor. NEVER FixedRate: 0 -- you lose visibility of error spikes
# during quiet windows.
AWSTemplateFormatVersion: "2010-09-09"
Description: multistate observability -- X-Ray sampling rule.
Resources:
  MultistateSamplingRule:
    Type: AWS::XRay::SamplingRule
    Properties:
      SamplingRule:
        RuleName: multistate-api-default
        Priority: 1000
        ReservoirSize: 10
        FixedRate: 0.05
        ServiceName: multistate-api
        ServiceType: "*"
        Host: "*"
        HTTPMethod: "*"
        URLPath: "*"
        ResourceARN: "*"
        Version: 1
